site:
  name: Base Impact
  site: 'https://baseimpact.org'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: null

# Default SEO metadata
metadata:
  title:
    default: Base Impact — Find Help
    template: '%s — Base Impact'
  description: "Find food, shelter, health, housing, and recovery resources in Brevard, Volusia, Orange & Statewide Counties. Technology help for Brevard County."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Base Impact
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: '@baseimpact'
    site: '@baseimpact'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: false

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'light:only' # Base Impact uses light mode primarily
